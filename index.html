<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <p><a href="../index.html">All CSS practice</a></p>
        <h1>CSS Grid System</h1>
        <p>Grid arranges content into rows and columns that can adapt to screen width.</p>
    </header>
    <main>
        <div class="Mother-div" aria-label="Grid of fifteen numbered items">
            <div class="Grid_items">1</div>
            <div class="Grid_items">2</div>
            <div class="Grid_items">3</div>
            <div class="Grid_items">4</div>
            <div class="Grid_items">5</div>
            <div class="Grid_items">6</div>
            <div class="Grid_items">7</div>
            <div class="Grid_items">8</div>
            <div class="Grid_items">9</div>
            <div class="Grid_items">10</div>
            <div class="Grid_items">11</div>
            <div class="Grid_items">12</div>
            <div class="Grid_items">13</div>
            <div class="Grid_items">14</div>
            <div class="Grid_items">15</div>
        </div>
    </main>
</body>
</html>
